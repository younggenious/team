```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>발표 | 조별 발표 공유</title>

<style>
:root {
  --primary: #7d2ae8;
  --hover: #651bc2;
  --bg: #f7f7fb;
  --text: #292633;
  --sub: #706b7a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: var(--bg);
  color: var(--text);
}
.container { max-width: 1000px; margin: auto; }
header { text-align: center; margin: 15px 0 28px; }
h1 { color: var(--primary); font-size: 40px; margin: 0 0 8px; }
header p { color: var(--sub); }
.panel, .card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 4px 15px #00000008;
  border: 1px solid #ece7f3;
}
.panel { margin-bottom: 28px; }
h2 { font-size: 20px; margin: 0 0 16px; }
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
}
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd6e8;
  border-radius: 9px;
  font-size: 15px;
}
input:focus { outline: 2px solid #e8d7ff; border-color: var(--primary); }
button {
  padding: 12px 16px;
  border: 0;
  border-radius: 9px;
  background: var(--primary);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: var(--hover); }
button:disabled { opacity: .6; cursor: wait; }
.submit { width: 100%; margin-top: 13px; }
.hint { color: var(--sub); font-size: 12px; line-height: 1.6; }
.status { margin-bottom: 15px; font-size: 14px; line-height: 1.6; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 16px;
}
.card { min-width: 0; }
.tag {
  display: inline-block;
  background: #f0e6ff;
  color: var(--primary);
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 10px;
}
.topic { font-size: 19px; font-weight: bold; overflow-wrap: anywhere; }
.meta { margin-top: 9px; color: var(--sub); font-size: 14px; line-height: 1.6; }
.url {
  display: block;
  margin-top: 15px;
  color: #5b20bc;
  overflow-wrap: anywhere;
  word-break: break-word;
  line-height: 1.6;
}
.url:hover { color: #31106b; }
.card-actions { display: flex; justify-content: flex-end; margin-top: 14px; }
.delete { background: #fff0f0; color: #b42332; font-size: 13px; }
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 35px 15px;
  background: white;
  border-radius: 12px;
  color: var(--sub);
}
.list-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}
.list-head h2 { margin: 0; }
@media(max-width: 560px) {
  body { padding: 14px; }
  h1 { font-size: 32px; }
  .panel { padding: 16px; }
}
</style>
</head>

<body>
<div class="container">
  <header>
    <h1>발표</h1>
    <p>각 조의 발표 자료를 공유하고 서로 확인해 보세요.</p>
  </header>

  <div id="status" class="status" role="status"></div>

  <section class="panel">
    <h2>발표 자료 공유하기</h2>

    <form id="teamForm">
      <div class="form-grid">
        <input id="teamName" maxlength="60"
          placeholder="조 이름 (예: 2조)" required>

        <input id="topic" maxlength="160"
          placeholder="발표 주제" required>

        <input id="sharer" maxlength="80"
          placeholder="공유한 사람 이름" required>

        <input id="members" maxlength="300"
          placeholder="조원 이름 (쉼표로 구분)" required>

        <input id="link" type="url"
          placeholder="Canva 공유 링크 (https://...)" required>
      </div>

      <button id="submitBtn" class="submit" type="submit">
        발표 링크 공유하기
      </button>

      <p class="hint">
        공유한 사람 이름은 직접 입력합니다.
        링크는 Canva에서 공유 설정을 완료한 주소를 사용하세요.
      </p>
    </form>
  </section>

  <section>
    <div class="list-head">
      <h2>공유된 발표</h2>
      <button id="refreshBtn" type="button">새로고침</button>
    </div>

    <div id="cardGrid" class="grid">
      <div class="empty">발표 목록을 불러오는 중...</div>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL =
  'https://lxvaogzkibqvumphvkuv.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_4ihJEbVGHB6X2k_DtchQdw_S6xG2bAr';

const API_URL = `${SUPABASE_URL}/rest/v1/teams`;

const headers = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

const grid = document.getElementById('cardGrid');
const statusBox = document.getElementById('status');

function message(text, error = false) {
  statusBox.textContent = text;
  statusBox.style.color = error ? '#b42332' : '#5720a0';
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    "'": '&#39;',
    '"': '&quot;'
  })[c]);
}

function validCanvaLink(value) {
  try {
    const url = new URL(value);
    return url.protocol === 'https:' &&
      (url.hostname === 'canva.com' ||
       url.hostname.endsWith('.canva.com'))
      ? url.href : null;
  } catch {
    return null;
  }
}

async function fetchTeams() {
  grid.innerHTML =
    '<div class="empty">발표 목록을 불러오는 중...</div>';

  try {
    const response = await fetch(
      `${API_URL}?select=*&order=id.desc`,
      { headers }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || `HTTP ${response.status}`);
    }

    if (!data.length) {
      grid.innerHTML =
        '<div class="empty">아직 등록된 발표가 없습니다.</div>';
      return;
    }

    grid.innerHTML = data.map(item => {
      const link = validCanvaLink(item.link);

      return `
        <article class="card">
          <span class="tag">${escapeHtml(item.team_name)}</span>

          <div class="topic">${escapeHtml(item.title)}</div>

          <div class="meta">
            공유한 사람: <strong>${escapeHtml(item.sharer)}</strong>
          </div>

          <div class="meta">
            조원: ${escapeHtml(item.members)}
          </div>

          ${
            link
              ? `<a class="url"
                   href="${escapeHtml(link)}"
                   target="_blank"
                   rel="noopener noreferrer">${escapeHtml(link)}</a>`
              : '<div class="meta">링크를 확인할 수 없습니다.</div>'
          }

          <div class="card-actions">
            <button class="delete" type="button"
              data-delete="${escapeHtml(item.id)}">삭제</button>
          </div>
        </article>
      `;
    }).join('');

    grid.querySelectorAll('[data-delete]').forEach(button => {
      button.addEventListener('click', () =>
        deleteTeam(button.dataset.delete)
      );
    });

  } catch (error) {
    grid.innerHTML = `
      <div class="empty">
        목록을 불러오지 못했습니다.<br>
        Supabase 테이블과 권한 설정을 확인하세요.
      </div>
    `;
    message(`연결 오류: ${error.message}`, true);
  }
}

document.getElementById('teamForm').addEventListener(
  'submit', async event => {
    event.preventDefault();

    const team_name =
      document.getElementById('teamName').value.trim();
    const title =
      document.getElementById('topic').value.trim();
    const sharer =
      document.getElementById('sharer').value.trim();
    const members =
      document.getElementById('members').value.trim();
    const link = validCanvaLink(
      document.getElementById('link').value.trim()
    );

    if (!team_name || !title || !sharer || !members) {
      message('모든 입력 칸을 채워 주세요.', true);
      return;
    }

    if (!link) {
      message('올바른 Canva 공유 링크를 입력해 주세요.', true);
      return;
    }

    const button = document.getElementById('submitBtn');
    button.disabled = true;
    button.textContent = '등록 중...';

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          ...headers,
          Prefer: 'return=representation'
        },
        body: JSON.stringify({
          team_name, title, sharer, members, link
        })
      });

      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          result.message || result.details || `HTTP ${response.status}`
        );
      }

      event.target.reset();
      message('발표 링크를 공유했습니다!');
      await fetchTeams();

    } catch (error) {
      message(
        `등록 실패: ${error.message}. SQL 설정과 테이블 열 이름을 확인하세요.`,
        true
      );
    } finally {
      button.disabled = false;
      button.textContent = '발표 링크 공유하기';
    }
  }
);

async function deleteTeam(id) {
  if (!confirm('이 발표를 삭제할까요?')) return;

  try {
    const response = await fetch(
      `${API_URL}?id=eq.${encodeURIComponent(id)}`,
      {
        method: 'DELETE',
        headers
      }
    );

    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.message || `HTTP ${response.status}`);
    }

    message('삭제 요청을 처리했습니다.');
    await fetchTeams();

  } catch (error) {
    message(`삭제 실패: ${error.message}`, true);
  }
}

document.getElementById('refreshBtn')
  .addEventListener('click', fetchTeams);

fetchTeams();
</script>
</body>
</html>
