<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>발표</title>
  <meta name="theme-color" content="#111827">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151d30;
      --line: #293650;
      --text: #f3f6ff;
      --muted: #9aa9c4;
      --blue: #647cff;
      --cyan: #39d9ff;
      --red: #ff637d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #1a2850 0, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    header {
      padding: 34px 20px 26px;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      margin-bottom: 12px;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #07101e;
      font-size: 25px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 48px);
      letter-spacing: -2px;
    }

    header p {
      color: var(--muted);
      margin: 12px 0 0;
    }

    main {
      width: min(100% - 28px, 1000px);
      margin: 28px auto 60px;
    }

    .panel {
      padding: 24px;
      background: rgba(21, 29, 48, .94);
      border: 1px solid var(--line);
      border-radius: 20px;
      margin-bottom: 24px;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      color: #c9d5ed;
      font-size: 13px;
      font-weight: 700;
    }

    input, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #34415e;
      border-radius: 11px;
      outline: none;
      background: #0d1425;
      color: var(--text);
      font: inherit;
    }

    input:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #647cff24;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
      transition: transform .15s, opacity .15s;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: wait; transform: none; }

    .primary {
      background: linear-gradient(110deg, var(--blue), var(--cyan));
      color: #07101e;
    }

    .secondary {
      background: #26334e;
      color: var(--text);
    }

    .danger {
      background: #492333;
      color: #ff9bab;
      padding: 9px 12px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .status {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status.error { color: #ff8799; }
    .status.success { color: #6ee7b7; }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .list-header h2 { margin: 0; }

    .count {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 800;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .presentation {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #10182a;
    }

    .presentation-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .team-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
      background: #647cff20;
      color: #aebaff;
      font-size: 12px;
      font-weight: 800;
    }

    .presentation h3 {
      margin: 14px 0 12px;
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .link-box {
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      background: #080e1c;
      border: 1px solid #26334e;
    }

    .link-box a {
      color: var(--cyan);
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.7;
      font-size: 13px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 42px 16px;
      border: 1px dashed #34415e;
      border-radius: 14px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }

    .loading {
      opacity: .7;
      text-align: center;
      padding: 25px;
      color: var(--muted);
    }

    footer {
      padding: 0 15px 30px;
      color: #697994;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 650px) {
      .form-grid, .cards { grid-template-columns: 1fr; }
      .panel { padding: 18px; }
      .field.full { grid-column: auto; }
      header { padding-top: 26px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">P</div>
    <h1>발표</h1>
    <p>조별 발표 자료를 등록하고 함께 공유하세요.</p>
  </header>

  <main>
    <section class="panel">
      <h2>＋ 발표 자료 등록</h2>

      <form id="presentationForm">
        <div class="form-grid">
          <div class="field">
            <label for="teamName">조 이름</label>
            <input id="teamName" name="team_name" maxlength="60"
              placeholder="예: 2조" required>
          </div>

          <div class="field">
            <label for="sharer">공유한 사람</label>
            <input id="sharer" name="sharer" maxlength="80"
              placeholder="이름 입력" required>
          </div>

          <div class="field full">
            <label for="title">발표 주제</label>
            <input id="title" name="title" maxlength="160"
              placeholder="발표 주제를 입력하세요" required>
          </div>

          <div class="field full">
            <label for="members">조원 이름</label>
            <textarea id="members" name="members" maxlength="300"
              placeholder="조원 이름을 입력하세요" required></textarea>
          </div>

          <div class="field full">
            <label for="link">Canva 발표 링크</label>
            <input id="link" name="link" type="url" maxlength="2000"
              placeholder="https://www.canva.com/..." required>
          </div>
        </div>

        <div class="form-actions">
          <button class="primary" id="submitButton" type="submit">
            발표 자료 공유하기
          </button>
          <button class="secondary" type="reset">초기화</button>
        </div>

        <div id="formStatus" class="status" role="status"></div>
      </form>
    </section>

    <section class="panel">
      <div class="list-header">
        <h2>공유된 발표</h2>
        <span id="count" class="count">0개</span>
      </div>

      <div id="presentationList" class="cards">
        <div class="loading">발표 자료를 불러오는 중...</div>
      </div>

      <div class="form-actions">
        <button class="secondary" id="refreshButton" type="button">
          ↻ 새로고침
        </button>
      </div>
      <div id="listStatus" class="status" role="status"></div>
    </section>
  </main>

  <footer>발표 자료 공유 플랫폼</footer>
